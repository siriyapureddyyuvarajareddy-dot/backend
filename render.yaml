services:
  - type: web
    name: backend-lab-01
    runtime: node
    plan: free
    rootDir: Backend-Development-Fundamentals-main/lab-01
    buildCommand: npm install
    startCommand: npm start

  - type: web
    name: backend-lab-02
    runtime: node
    plan: free
    rootDir: Backend-Development-Fundamentals-main/lab-02
    buildCommand: npm install --build-from-source sqlite3
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0

  - type: web
    name: backend-lab-03
    runtime: node
    plan: free
    rootDir: Backend-Development-Fundamentals-main/lab-03
    buildCommand: npm install --build-from-source sqlite3
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
